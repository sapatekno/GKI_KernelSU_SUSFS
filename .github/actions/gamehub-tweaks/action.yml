name: 'Include GameHub Tweaks'
description: 'Bundles gamehub_tweaks.sh and auto-install hook into AnyKernel3'

runs:
  using: 'composite'
  steps:
    - name: Setup GameHub Tweaks in AnyKernel3
      shell: bash
      run: |
        set -euo pipefail
        if [ -d "${{ github.workspace }}/AnyKernel3" ]; then
          cp "${{ github.action_path }}/gamehub_tweaks.sh" "${{ github.workspace }}/AnyKernel3/gamehub_tweaks.sh"
          chmod +x "${{ github.workspace }}/AnyKernel3/gamehub_tweaks.sh"

          if [ -f "${{ github.workspace }}/AnyKernel3/anykernel.sh" ]; then
            echo "" >> "${{ github.workspace }}/AnyKernel3/anykernel.sh"
            echo "# Install GameHub Tweaks Service if KernelSU/Magisk environment exists" >> "${{ github.workspace }}/AnyKernel3/anykernel.sh"
            echo 'if [ -d "/data/adb/service.d" ]; then' >> "${{ github.workspace }}/AnyKernel3/anykernel.sh"
            echo '  ui_print "  • Installing GameHub Tweaks into /data/adb/service.d...";' >> "${{ github.workspace }}/AnyKernel3/anykernel.sh"
            echo '  cp -f ${AKHOME:-$PWD}/gamehub_tweaks.sh /data/adb/service.d/gamehub_tweaks.sh 2>/dev/null || true;' >> "${{ github.workspace }}/AnyKernel3/anykernel.sh"
            echo '  chmod 755 /data/adb/service.d/gamehub_tweaks.sh 2>/dev/null || true;' >> "${{ github.workspace }}/AnyKernel3/anykernel.sh"
            echo 'fi;' >> "${{ github.workspace }}/AnyKernel3/anykernel.sh"
          fi
        fi
